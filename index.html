<style>
:root{--bg:#FAF8F0;--card:#FFFEFA;--ink:#14291B;--mute:#5C6B60;--line:#E4E0CD;--brand:#35603F;--onbrand:#fff;--hi:#DDEAD7;--sand:#E9E4D2;--ok:#35603F;

["La regla de los 15 minutos",5,"El desorden no se vence en un fin de semana heroico, sino con ratos cortos. Poné un temporizador de 15 minutos y trabajá un solo rincón. Cuando suene, pará.\nParar a tiempo es parte del método: así mañana vas a querer volver.","Elegí un cajón o un estante y trabajá en él 15 minutos hoy."],
["Tu mapa de la casa",7,"Dibujá o anotá las zonas: cocina, baño, dormitorios, living, entrada. Calificá cada una del 1 al 5 según cuánto te molesta.\nEmpezá por la entrada o la cocina: son las que más ves y las que más tiempo te ahorran.","Escribí tus zonas y ponele una nota a cada una. Marcá cuál va primero."],
["Las cuatro cajas",8,"Tené a mano cuatro cajas o bolsas: Se queda, Se va (donar), Se tira y Otro lugar. Cada objeto va a una, sin quedarse a mitad de camino.\nVaciá las cajas el mismo día: lo que queda en el pasillo vuelve a la casa.","Llená las cuatro cajas con 10 objetos de una zona y sacá de la casa las de “Se va” y “Se tira”."],
["Tu kit de arranque",6,"Reuní en una caja o un balde lo que vas a usar siempre: trapo, esponja, bolsas de residuos, guantes y un rociador. Tenerlo todo junto te ahorra vueltas y excusas.\nGuardalo en un lugar de fácil acceso, cerca de donde más limpiás.","Armá tu kit de limpieza y dejalo a mano."]]},
{t:"Limpieza que se mantiene",l:[
["Rutina diaria de 10 minutos",6,"Una casa limpia se sostiene con poco, todos los días: hacer la cama, lavar los platos, limpiar la mesada y levantar lo que está fuera de lugar.\nAtá la rutina a algo que ya hacés, como el mate de la mañana o la cena.","Escribí tus cuatro tareas diarias y hacé la rutina completa hoy."],
["Limpieza semanal por zonas",8,"En vez de limpiar todo en un día, asigná una zona a cada día: lunes baño, martes cocina, miércoles dormitorios, jueves polvo y pisos.\nVeinte minutos por zona alcanzan si la rutina diaria está al día.","Asigná una zona a cada día de la semana y ponela en tu calendario."],
["Productos básicos y seguridad",7,"Con detergente neutro, vinagre, bicarbonato y un desengrasante resolvés casi todo. Menos productos, menos gasto y menos riesgo.\nNunca mezcles lavandina con vinagre, amoníaco ni otros limpiadores: se generan gases tóxicos. Ventilá siempre que uses productos fuertes.","Revisá tus productos de limpieza y apartá los que repiten función."],
["Pisos y superficies",7,"Primero sacá el polvo seco, con escoba o aspiradora, y recién después lavá: si lavás con polvo, hacés barro.\nTrabajá del fondo hacia la salida para no pisar lo que ya limpiaste, y cambiá el agua cuando se ponga gris.","Limpiá un ambiente de punta a punta con ese orden y cronometrá cuánto tardás."],
["Vidrios y ventanas",6,"Elegí un día nublado o limpiá a la tarde: con sol directo, el producto se seca rápido y deja marcas.\nPasá primero un paño húmedo y secá con un secador de vidrios o con papel de diario, de arriba hacia abajo y en forma de S.","Limpiá una ventana o un espejo con esa técnica."]]},
{t:"Cocina y baño",l:[
["La cocina de arriba abajo",10,"Limpiá de arriba hacia abajo: alacenas y estantes primero, después la mesada y al final el piso. Lo que cae no ensucia lo que ya limpiaste.\nCerrá con la cocina y la pileta, que es lo que más se nota.","Despejá la mesada y dejá solo lo que usás todos los días."],
["Baño sin esfuerzo",8,"Aplicá el producto al empezar y dejalo actuar unos minutos mientras hacés otra cosa. El tiempo hace el trabajo, no la fuerza.\nTerminá con el espejo y el piso. Un secador de vidrios en la ducha evita el sarro.","Limpiá el baño con la técnica de dejar actuar y cronometralo."],
["Heladera y alacena",8,"Una vez por semana, antes de hacer las compras, mirá qué hay en la heladera: tirá lo vencido y poné adelante lo que hay que usar primero.\nLimpiá los estantes con agua tibia y un chorrito de vinagre. En la alacena, dejá a la altura de los ojos lo que usás todos los días.","Ordená un estante de la heladera y uno de la alacena."],
["Horno y electrodomésticos",8,"Con el horno tibio, no caliente, pasá una pasta de bicarbonato y agua y dejala actuar 20 minutos. Después sacala con un trapo húmedo.\nEl microondas se limpia en un minuto: dejá un bol con agua y limón 2 minutos adentro y pasá un trapo.","Limpiá el microondas o el horno con el método de dejar actuar."]]},
{t:"Dormitorios y placards",l:[
["Placard por categorías",10,"Sacá todo y ponelo arriba de la cama. Probate lo dudoso y decidí: si no te queda o no lo usás, se va.\nVolvé a guardar por tipo y color, con el mismo tipo de percha.","Terminá una sección del placard: camisas, pantalones o abrigos."],
["Cama y mesa de luz",5,"La mesa de luz guarda lo que usás de noche: el velador, un libro, el cargador y poco más. Todo lo demás tiene otro lugar.\nUna cama hecha cambia cómo se ve todo el cuarto.","Vaciá tu mesa de luz y devolvé solo lo que usás cada noche."],
["Ropa de temporada",7,"Guardá lo que no vas a usar en cajas transparentes y etiquetadas. Lavá todo antes de guardarlo.\nAnotá en la caja la fecha en que la vas a abrir de nuevo.","Prepará una caja de ropa de temporada y etiquetala."],
["Papeles y cosas chiquitas",7,"Los papeles son lo que más se acumula. Armá tres carpetas o sobres: Para hacer, Para guardar y Para tirar. Lo que llega, va a uno de los tres el mismo día.\nUna vez al mes, revisá y vaciá la de Para tirar.","Armá tus tres carpetas y clasificá los papeles que tengas a la vista."],
["El cuarto de los chicos",7,"Armá cajas o canastos por tipo de juguete y ponele a cada uno una etiqueta con un dibujo, así los chicos pueden guardar solos.\nSumá una caja de Descanso: los juguetes que no se usan salen del cuarto por un mes y vuelven solo si los piden.","Elegí un tipo de juguete y armale su canasto."]]},
{t:"Hábitos para que dure",l:[
["Uno entra, uno sale",5,"Cada objeto nuevo que entra tiene que sacar a uno parecido. Así la casa no se vuelve a llenar.\nEs la regla más simple y la que más protege tu trabajo.","Aplicá la regla en la próxima compra que hagas."],
["Reset semanal de 20 minutos",6,"Un día fijo, dedicá 20 minutos a devolver todo a su lugar, vaciar la bandeja de papeles y preparar la semana.\nSi lo hacés siempre el mismo día, se vuelve hábito.","Elegí tu día y hora de reset y programalo."],
["Tu plan de 30 días",8,"Juntá lo aprendido: una zona por semana, rutina diaria y reset semanal. Un ambiente a la vez.\nNo busques la perfección; buscá que cada semana esté un poco mejor.","Escribí tu plan de 4 semanas, una zona por semana."],
["Plan B para semanas difíciles",6,"Va a haber semanas en las que no llegues a todo, y no pasa nada. Volvé al paso más chico: 15 minutos en un solo rincón.\nNo quieras recuperar todo de golpe. Retomá la rutina diaria y el reset semanal, y en pocos días estás de vuelta.","Escribí tu plan B: cuál es tu rincón de rescate para las semanas difíciles."],
["Que toda la casa colabore",6,"El orden no tiene que ser cosa de una sola persona. Armá una lista de tareas diarias y semanales y repartila entre quienes viven en la casa.\nPonela a la vista, por ejemplo en la heladera, y revisenla juntos en el reset semanal.","Repartí tres tareas de tu lista entre las personas de tu casa."]]}
];

  if(f=document.getElementById('chk'))f.onclick=function(){S.v='check';save();render();window.scrollTo(0,0)};
  if(f=document.getElementById('rem'))f.onclick=recordatorio;
  if(f=document.getElementById('ins'))f.onclick=instalar;
  if(f=document.getElementById('vp'))f.onclick=function(){document.getElementById('prog').scrollIntoView({behavior:'smooth'})};
  document.querySelectorAll('[data-tv]').forEach(function(b){b.onclick=function(){S.v=b.dataset.tv;ED=null;save();render();window.scrollTo(0,0)}});
  if(f=document.getElementById('ft'))f.onsubmit=function(e){e.preventDefault();var v=document.getElementById('tn').value.trim();if(v){S.tasks.push({id:Date.now(),g:document.getElementById('tg').value,n:v,c:0});save();render()}};
  document.querySelectorAll('[data-tc]').forEach(function(i){i.onchange=function(){var t=S.tasks.find(function(x){return x.id==i.dataset.tc});t.c=i.checked?1:0;if(i.checked)mark();save();render()}});
  document.querySelectorAll('[data-td]').forEach(function(b){b.onclick=function(){S.tasks=S.tasks.filter(function(x){return x.id!=b.dataset.td});save();render()}});
  document.querySelectorAll('[data-ed]').forEach(function(b){b.onclick=function(){ED=+b.dataset.ed;render();var el=document.getElementById('et');if(el)el.focus()}});
  if(f=document.getElementById('et'))f.onkeydown=function(e){if(e.key==='Enter')saveEd()};
  document.querySelectorAll('[data-sv]').forEach(function(b){b.onclick=saveEd});
  if(f=document.getElementById('tcl'))f.onclick=function(){S.tasks=S.tasks.filter(function(x){return !x.c});save();render()};
  if(f=document.getElementById('undo'))f.onclick=function(){delete S.done[S.m+'-'+S.l];save();render()};
  if(f=document.getElementById('rst'))f.onclick=function(){if(this.dataset.ok){S.done={};S.v='home';save();render()}else{this.dataset.ok=1;this.textContent='Tocá de nuevo para destildar todo'}};
  document.querySelectorAll('[data-rm]').forEach(function(b){b.onclick=function(){var m=+b.dataset.rm;M[m].l.forEach(function(x,i){delete S.done[m+'-'+i]});save();render()}});
  if(f=document.getElementById('pre'))f.onclick=cargarLista;
  if(f=document.getElementById('unt'))f.onclick=function(){S.tasks.forEach(function(t){t.c=0});save();render()};
  if(f=document.getElementById('addt'))f.onclick=function(){S.tasks.push({id:Date.now(),n:M[S.m].l[S.l][3],c:0});save();this.textContent='Agregada ✓';this.disabled=true};
  if(f=document.getElementById('fs'))f.onsubmit=function(e){e.preventDefault();var i=document.getElementById('sn');if(i.value.trim()){addShop(i.value,false);VMSG='';save();render()}};
  if(f=document.getElementById('mic'))f.onclick=function(){dictar('shop')};
  if(f=document.getElementById('mict'))f.onclick=function(){dictar('tasks')};
  document.querySelectorAll('[data-sc]').forEach(function(i){i.onchange=function(){var t=S.shop.find(function(x){return x.id==i.dataset.sc});t.c=i.checked?1:0;save();render()}});
  document.querySelectorAll('[data-sd]').forEach(function(b){b.onclick=function(){S.shop=S.shop.filter(function(x){return x.id!=b.dataset.sd});save();render()}});
  if(f=document.getElementById('scl'))f.onclick=function(){S.shop=S.shop.filter(function(x){return !x.c});save();render()};
  if(f=document.getElementById('cpy'))f.onclick=function(){var tx=S.shop.filter(function(x){return !x.c}).map(function(x){return '- '+x.n}).join(String.fromCharCode(10));try{navigator.clipboard.writeText(tx).then(function(){setVm('Lista copiada.')},function(){setVm('No pude copiar. Seleccioná y copiá a mano.')})}catch(e){setVm('No pude copiar.')}};
  document.querySelectorAll('[data-mt]').forEach(function(b){b.onclick=function(){var y=window.scrollY;S.mt=+b.dataset.mt;save();render();window.scrollTo(0,y)}});
  var sel=document.querySelector('.mtab.sel');if(sel&&sel.scrollIntoView)sel.scrollIntoView({inline:'center',block:'nearest'});
  document.querySelectorAll('[data-pw]').forEach(function(b){b.onclick=paywall});
  document.querySelectorAll('[data-m]').forEach(function(b){b.onclick=function(){go(+b.dataset.m,+b.dataset.l)}});
  if(f=document.getElementById('cont'))f.onclick=function(){var n=nextUndone();go(n[0],n[1])};
  if(f=document.getElementById('back'))f.onclick=function(){S.v='home';save();render()};
  if(f=document.getElementById('fin'))f.onclick=function(){
    S.done[S.m+'-'+S.l]=1;mark();
    var m=S.m,l=S.l+1;if(l>=M[m].l.length){m++;l=0}
    if(m>=M.length){S.v='home';save();render();window.scrollTo(0,0);return}
    if(locked(m)){S.v='home';save();render();paywall();return}
    go(m,l)};
  if(f=document.getElementById('prt'))f.onclick=function(){window.print()};
}
render();
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script>
</body>
</html>
